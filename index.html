<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8a4b24" />
  <title>膠劍仔大戰｜吉利文具士多</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=land28" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="menu-body">
  <main class="menu-screen">
    <img class="menu-bg" src="packages/package_bg.webp" alt="" />
    <div class="menu-shade"></div>

    <div class="menu-play">
      <h1 class="menu-title">on膠劍仔大作戰</h1>
      <form class="menu-ticket" id="menu-ticket">
        <label>場地
          <select id="ticket-terrain">
            <option value="wood">木桌</option>
            <option value="terrazzo">水磨石</option>
            <option value="concrete">水泥地</option>
          </select>
        </label>
        <label>難度
          <select id="ticket-ai">
            <option value="normal">普通</option>
            <option value="hard">困難</option>
          </select>
        </label>
        <label>武器
          <select id="ticket-weapon">
            <option value="">抽卡決定</option>
            <option value="random">隨機決定</option>
          </select>
        </label>
      </form>
      <nav class="menu-board" aria-label="開波">
      <a class="menu-btn cpu" data-mode="cpu" href="play.html?mode=cpu">
        <i class="menu-mark" aria-hidden="true">電</i>
        <strong>VS 電腦</strong>
        <span>挑戰AI士多高手，隨時隨地練習彈劍技巧。</span>
      </a>
      <a class="menu-btn duo" data-mode="duo" href="play.html?mode=duo">
        <i class="menu-mark" aria-hidden="true">雙</i>
        <strong>雙人對戰</strong>
        <span>一人一邊，同一個螢幕鬥快彈劍疊骨！</span>
      </a>
      <button type="button" class="menu-btn online" id="open-room">
        <i class="menu-mark" aria-hidden="true">房</i>
        <strong>線上對戰</strong>
        <span>自建房號或輸入朋友房號，跨網路對決！</span>
      </button>
      </nav>
    </div>

    <p class="menu-foot"><a href="gallery.html">收藏館</a><a href="weapons.html">武器數值</a><a href="cpanel.html">後台設定</a></p>
  </main>

  <div id="room-modal" class="room-modal" hidden>
    <div class="room-card" role="dialog" aria-modal="true" aria-labelledby="room-title">
      <h2 id="room-title">線上對戰</h2>
      <p>自建房號，或者輸入朋友個房號。</p>
      <label for="room-code-input">房號</label>
      <input id="room-code-input" maxlength="6" autocomplete="off" placeholder="例如 K7M2" />
      <div class="room-actions">
        <button type="button" id="join-room">加入房間</button>
        <button type="button" class="make" id="make-room">建立新房間</button>
      </div>
      <div id="room-result" class="room-code" hidden>
        <span id="room-result-label">你的房號</span>
        <b id="room-result-code"></b>
        <button type="button" id="copy-room">複製房號</button>
      </div>
      <p id="room-note" class="room-note"></p>
        <button type="button" class="primary" id="enter-room" hidden>進入對局</button>
        <button type="button" class="room-close" id="close-room">關閉</button>
    </div>
  </div>

  <script>
    const modal = document.getElementById("room-modal");
    const codeInput = document.getElementById("room-code-input");
    const note = document.getElementById("room-note");
    const result = document.getElementById("room-result");
    const resultLabel = document.getElementById("room-result-label");
    const resultCode = document.getElementById("room-result-code");

    function openModal() {
      modal.hidden = false;
      note.textContent = "";
      codeInput.focus();
    }

    function closeModal() {
      modal.hidden = true;
    }

    function showRoom(label, code) {
      result.hidden = false;
      resultLabel.textContent = label;
      resultCode.textContent = code;
      document.getElementById("enter-room").hidden = false;
    }

    function makeCode() {
      const alphabet = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
      let code = "";
      for (let i = 0; i < 4; i += 1) code += alphabet[Math.floor(Math.random() * alphabet.length)];
      return code;
    }

    document.getElementById("menu-ticket").addEventListener("submit", (event) => {
      event.preventDefault();
    });

    function pickThreeWeapons() {
      const pool = ["guan", "jian", "ji", "dadao", "snake"];
      const bag = pool.slice();
      for (let i = bag.length - 1; i > 0; i -= 1) {
        const swap = Math.floor(Math.random() * (i + 1));
        const held = bag[i];
        bag[i] = bag[swap];
        bag[swap] = held;
      }
      return bag.slice(0, 3);
    }

    let roomSeat = "p1";

    function playTicket(mode, room) {
      const terrain = document.getElementById("ticket-terrain").value;
      const ai = document.getElementById("ticket-ai").value;
      const weapon = document.getElementById("ticket-weapon").value;
      const params = new URLSearchParams();
      params.set("mode", mode);
      if (terrain) params.set("terrain", terrain);
      if (mode === "cpu") params.set("ai", ai);
      if (mode === "online") {
        const choice = weapon === "random" ? "random" : "pack";
        params.set("seat", roomSeat);
        params.set("weapon", choice);
        if (room) params.set("room", room);
        sessionStorage.setItem("sword-play-v1", JSON.stringify({
          mode: mode,
          terrain: terrain,
          ai: "",
          room: room || "",
          seat: roomSeat,
          weapon: choice,
        }));
        if (choice === "random") params.set("roll", pickThreeWeapons().join(","));
        return (choice === "random" ? "play.html?" : "pack.html?") + params.toString();
      }
      if (weapon === "random") params.set("roll", pickThreeWeapons().join(","));
      if (room && mode !== "online") params.set("room", room);
      if (!weapon) {
        sessionStorage.setItem("sword-play-v1", JSON.stringify({
          mode: mode,
          terrain: terrain,
          ai: mode === "cpu" ? ai : "",
          room: room || "",
          seat: mode === "online" ? roomSeat : "",
        }));
        return "pack.html?mode=" + encodeURIComponent(mode);
      }
      return "play.html?" + params.toString();
    }

    function enterOnline() {
      const code = (resultCode.textContent || codeInput.value).trim().toUpperCase();
      if (!/^[A-Z0-9]{4,6}$/.test(code)) {
        result.hidden = true;
        document.getElementById("enter-room").hidden = true;
        note.textContent = "房號要 4 至 6 個英文字或數字。";
        codeInput.focus();
        return;
      }
      window.location.href = playTicket("online", code);
    }

    document.querySelectorAll(".menu-btn[href]").forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        link.classList.add("is-lit");
        const next = link.dataset.mode ? playTicket(link.dataset.mode) : link.getAttribute("href");
        window.setTimeout(() => {
          window.location.href = next;
        }, 180);
      });
    });

    document.getElementById("open-room").addEventListener("click", () => {
      document.getElementById("open-room").classList.add("is-lit");
      window.setTimeout(() => {
        document.getElementById("open-room").classList.remove("is-lit");
        openModal();
      }, 140);
    });

    document.getElementById("close-room").addEventListener("click", closeModal);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeModal();
    });

    function onlineSeatNote(seat) {
      const who = seat === "p1" ? "你係玩家一。" : "你係玩家二。";
      if (document.getElementById("ticket-weapon").value === "random") {
        return who + "隨機決定：進入對局後會派三種不同的劍，兩邊都入房先開波。";
      }
      return who + "抽卡決定：進入對局後各自撕三包，兩個人抽完先開波。";
    }

    document.getElementById("ticket-weapon").addEventListener("change", () => {
      if (!result.hidden) note.textContent = onlineSeatNote(roomSeat);
    });

    document.getElementById("make-room").addEventListener("click", () => {
      const code = makeCode();
      roomSeat = "p1";
      codeInput.value = code;
      showRoom("新房間已開好", code);
      note.textContent = onlineSeatNote("p1");
    });

    document.getElementById("join-room").addEventListener("click", () => {
      const code = codeInput.value.trim().toUpperCase();
      if (!/^[A-Z0-9]{4,6}$/.test(code)) {
        result.hidden = true;
        document.getElementById("enter-room").hidden = true;
        note.textContent = "房號要 4 至 6 個英文字或數字。";
        codeInput.focus();
        return;
      }
      roomSeat = "p2";
      showRoom("已加入房間", code);
      note.textContent = onlineSeatNote("p2");
    });

    document.getElementById("enter-room").addEventListener("click", enterOnline);

    document.getElementById("copy-room").addEventListener("click", async () => {
      const code = resultCode.textContent;
      try {
        await navigator.clipboard.writeText(code);
        note.textContent = "房號已複製。";
      } catch (error) {
        note.textContent = "房號係 " + code + "，請自行抄低。";
      }
    });
  </script>
</body>
</html>
