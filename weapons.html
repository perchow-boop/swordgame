<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>武器數值｜膠劍仔</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="book">
    <header class="sign">
      <p class="shop-name">德和文具士多 · 武器</p>
      <h1>武器數值</h1>
      <p class="shop-line">改完撳更新。抽卡同對戰重新入頁就用新數值、新圖。劍尖請向右，背景透明。</p>
      <a class="home-link" href="index.html">返回主畫面</a>
      <a class="home-link" href="gallery.html">收藏館</a>
      <a class="home-link" href="cpanel.html">後台設定</a>
      <a class="home-link" href="pack.html">抽卡</a>
    </header>

    <p id="weapon-note" class="weapon-note" role="status"></p>
    <div id="weapon-list" class="weapon-editor"></div>

    <section class="weapon-new" aria-label="新增武器">
      <h2>新增武器</h2>
      <img id="new-preview" alt="" />
      <label class="weapon-field block">名稱<input id="new-name" type="text" maxlength="12" placeholder="例如：青龍偃月" /></label>
      <label class="weapon-field block">PNG 圖<input id="new-file" type="file" accept="image/png" /></label>
      <label class="weapon-field">價值 🪙<input id="new-value" type="range" min="1" max="5" value="3" /><span data-for="new-value">3</span></label>
      <label class="weapon-field">重量 ⭐<input id="new-weight" type="range" min="1" max="5" value="3" /><span data-for="new-weight">3</span></label>
      <label class="weapon-field">摩擦力 ⭐<input id="new-grip" type="range" min="1" max="5" value="3" /><span data-for="new-grip">3</span></label>
      <label class="weapon-field">劍身質量<input id="new-mass" type="number" min="1" max="40" step="0.1" value="8" /></label>
      <label class="weapon-field">劍身摩擦<input id="new-friction" type="number" min="0.05" max="1" step="0.01" value="0.7" /></label>
      <label class="weapon-field">繪製比例<input id="new-scale" type="number" min="0.5" max="1.8" step="0.01" value="1" /></label>
      <label class="weapon-field">售價<input id="new-price" type="text" value="$6.0" maxlength="8" /></label>
      <label class="weapon-field">顏色<input id="new-tint" type="color" value="#c81d25" /></label>
      <label class="weapon-field block">特性<textarea id="new-trait" maxlength="40" placeholder="一句講明呢把劍點用。"></textarea></label>
      <button type="button" class="primary" id="add-weapon">加入武器庫</button>
    </section>

    <div class="weapon-actions">
      <button type="button" class="text-btn" id="reset-weapons">回復全部預設</button>
    </div>
  </main>

  <template id="weapon-card">
    <article class="weapon-card">
      <img data-preview alt="" />
      <h2 data-title></h2>
      <label class="weapon-field block">名稱<input data-field="name" type="text" maxlength="12" /></label>
      <label class="weapon-field">價值 🪙<input data-field="value" type="range" min="1" max="5" /><span data-readout="value"></span></label>
      <label class="weapon-field">重量 ⭐<input data-field="weight" type="range" min="1" max="5" /><span data-readout="weight"></span></label>
      <label class="weapon-field">摩擦力 ⭐<input data-field="grip" type="range" min="1" max="5" /><span data-readout="grip"></span></label>
      <label class="weapon-field">劍身質量<input data-field="mass" type="number" min="1" max="40" step="0.1" /></label>
      <label class="weapon-field">劍身摩擦<input data-field="friction" type="number" min="0.05" max="1" step="0.01" /></label>
      <label class="weapon-field">繪製比例<input data-field="scale" type="number" min="0.5" max="1.8" step="0.01" /></label>
      <label class="weapon-field">售價<input data-field="price" type="text" maxlength="8" /></label>
      <label class="weapon-field">顏色<input data-field="tint" type="color" /></label>
      <label class="weapon-field block">特性<textarea data-field="trait" maxlength="40"></textarea></label>
      <label class="weapon-field block">換 PNG<input data-file type="file" accept="image/png" /></label>
      <button type="button" class="primary" data-save>更新這把</button>
    </article>
  </template>

  <script src="weapon-store.js"></script>
  <script>
    const list = document.querySelector("#weapon-list");
    const template = document.querySelector("#weapon-card");
    const note = document.querySelector("#weapon-note");

    function say(message) {
      note.textContent = message;
    }

    function clamp(value, min, max, fallback) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(max, Math.max(min, number));
    }

    function readPng(file) {
      return new Promise((resolve, reject) => {
        if (!file) {
          resolve("");
          return;
        }
        if (file.type !== "image/png") {
          reject(new Error("請上載 PNG。"));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("圖檔讀唔到。"));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error("圖檔讀唔到。"));
          image.onload = () => {
            const max = 640;
            const scale = Math.min(1, max / Math.max(image.width, image.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/png"));
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function fieldsFrom(card) {
      const value = (name) => card.querySelector(`[data-field="${name}"]`).value;
      return {
        name: value("name").trim() || "未命名",
        value: clamp(value("value"), 1, 5, 3),
        weight: clamp(value("weight"), 1, 5, 3),
        grip: clamp(value("grip"), 1, 5, 3),
        mass: clamp(value("mass"), 1, 40, 8),
        friction: clamp(value("friction"), 0.05, 1, 0.7),
        scale: clamp(value("scale"), 0.5, 1.8, 1),
        price: value("price").trim() || "自訂",
        tint: value("tint") || "#8d6a3a",
        trait: value("trait").trim(),
      };
    }

    function persist(next) {
      try {
        WeaponStore.save(next);
      } catch (error) {
        say("儲存唔到。PNG 太大，請用細啲嘅圖再試。");
        return false;
      }
      return true;
    }

    function render() {
      list.replaceChildren();
      WeaponStore.load().forEach((weapon) => {
        const card = template.content.firstElementChild.cloneNode(true);
        card.dataset.id = weapon.id;
        const preview = card.querySelector("[data-preview]");
        preview.src = weapon.imageData || weapon.image || "";
        preview.alt = weapon.name;
        card.querySelector("[data-title]").textContent = weapon.name;
        ["name", "value", "weight", "grip", "mass", "friction", "scale", "price", "tint", "trait"].forEach((key) => {
          const input = card.querySelector(`[data-field="${key}"]`);
          if (weapon[key] != null) input.value = weapon[key];
        });
        card.querySelectorAll("[data-readout]").forEach((node) => {
          const input = card.querySelector(`[data-field="${node.dataset.readout}"]`);
          const paint = () => { node.textContent = input.value; };
          input.addEventListener("input", paint);
          paint();
        });
        card.querySelector("[data-field='name']").addEventListener("input", (event) => {
          card.querySelector("[data-title]").textContent = event.target.value || weapon.name;
        });
        card.querySelector("[data-file]").addEventListener("change", async (event) => {
          const file = event.target.files && event.target.files[0];
          if (!file) return;
          try {
            preview.src = await readPng(file);
          } catch (error) {
            say(error.message);
          }
        });
        card.querySelector("[data-save]").addEventListener("click", async () => {
          const next = WeaponStore.load();
          const index = next.findIndex((item) => item.id === weapon.id);
          if (index < 0) return;
          const file = card.querySelector("[data-file]").files[0];
          let imageData = next[index].imageData || "";
          try {
            if (file) imageData = await readPng(file);
          } catch (error) {
            say(error.message);
            return;
          }
          next[index] = Object.assign({}, next[index], fieldsFrom(card), imageData ? { imageData } : {});
          if (!persist(next)) return;
          say(`「${next[index].name}」已更新。重新入抽卡或對戰就會見到。`);
          render();
        });
        list.append(card);
      });
    }

    document.querySelectorAll("#new-value, #new-weight, #new-grip").forEach((input) => {
      const paint = () => {
        document.querySelector(`[data-for="${input.id}"]`).textContent = input.value;
      };
      input.addEventListener("input", paint);
    });

    document.querySelector("#new-file").addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        document.querySelector("#new-preview").src = await readPng(file);
      } catch (error) {
        say(error.message);
      }
    });

    document.querySelector("#add-weapon").addEventListener("click", async () => {
      const name = document.querySelector("#new-name").value.trim();
      const file = document.querySelector("#new-file").files[0];
      if (!name || !file) {
        say("新武器要有名稱同 PNG。");
        return;
      }
      let imageData = "";
      try {
        imageData = await readPng(file);
      } catch (error) {
        say(error.message);
        return;
      }
      const next = WeaponStore.load();
      next.push({
        id: "custom-" + Date.now().toString(36),
        name,
        image: "",
        imageData,
        mass: clamp(document.querySelector("#new-mass").value, 1, 40, 8),
        friction: clamp(document.querySelector("#new-friction").value, 0.05, 1, 0.7),
        scale: clamp(document.querySelector("#new-scale").value, 0.5, 1.8, 1),
        price: document.querySelector("#new-price").value.trim() || "自訂",
        tint: document.querySelector("#new-tint").value,
        value: clamp(document.querySelector("#new-value").value, 1, 5, 3),
        weight: clamp(document.querySelector("#new-weight").value, 1, 5, 3),
        grip: clamp(document.querySelector("#new-grip").value, 1, 5, 3),
        trait: document.querySelector("#new-trait").value.trim(),
      });
      if (!persist(next)) return;
      document.querySelector("#new-name").value = "";
      document.querySelector("#new-file").value = "";
      document.querySelector("#new-trait").value = "";
      document.querySelector("#new-preview").removeAttribute("src");
      say(`「${name}」已加入。兩邊玩家嘅武器欄都會見到。`);
      render();
    });

    document.querySelector("#reset-weapons").addEventListener("click", () => {
      WeaponStore.reset();
      say("已回復預設武器。自訂圖同新武器都清走咗。");
      render();
    });

    render();
  </script>
</body>
</html>
