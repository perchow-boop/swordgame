<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>武器收藏館｜膠劍仔</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <div class="gallery-bg" aria-hidden="true">
    <div class="gallery-wash"></div>
    <div class="gallery-grid"></div>
    <div class="gallery-dots"></div>
    <div class="gallery-glow"></div>
    <div class="gallery-spots"></div>
  </div>

  <header class="gallery-bar">
    <a class="gallery-back" href="index.html">返回主畫面</a>
    <div class="gallery-title">
      <p>德和文具士多</p>
      <h1>武器收藏館</h1>
    </div>
    <p id="gallery-count" class="gallery-count">已入手 0 / 0</p>
  </header>

  <main class="gallery-wall" id="gallery-wall" aria-label="收藏牆"></main>
  <div class="gallery-dim" aria-hidden="true"></div>

  <section class="inspector" id="inspector" aria-hidden="true">
    <div class="spotlight" aria-hidden="true"></div>
    <div class="inspect-stage">
      <canvas id="pedestal" class="pedestal" width="800" height="460" aria-hidden="true"></canvas>
      <div class="inspect-figure" id="inspect-figure">
        <canvas id="inspect-slab" class="inspect-slab" aria-hidden="true"></canvas>
        <img id="inspect-photo" alt="" />
        <span id="inspect-mask" class="silhouette" hidden></span>
        <span id="inspect-fallback" class="fallback-blade" hidden></span>
      </div>
      <div class="inspect-caption">
        <h2 id="inspect-name"></h2>
        <p id="inspect-state"></p>
        <p class="inspect-hint">拖住把劍可以轉一圈。</p>
      </div>
    </div>
    <button type="button" class="inspect-close" id="inspect-close">返回收藏牆</button>
  </section>

  <script src="weapon-store.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
